<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GPT Image 2 retouch test</title>
  <style>
    body{font-family:Arial,sans-serif;max-width:900px;margin:35px auto;padding:0 16px;color:#17131c}
    input,select,button{font:inherit}
    .url{width:100%;padding:11px;margin:7px 0 16px;box-sizing:border-box}
    .controls{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
    button{padding:12px 18px;cursor:pointer}
    .imgs{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
    .card{background:#f4f2f6;border-radius:14px;min-height:280px;padding:12px}
    .card img{width:100%;height:430px;object-fit:contain}
    pre{padding:14px;background:#f4f4f4;border-radius:12px;white-space:pre-wrap}
    @media(max-width:650px){.imgs{grid-template-columns:1fr}.card img{height:360px}}
  </style>
</head>
<body>
  <h1>Тест реальной ретуши GPT Image 2</h1>

  <label>API URL</label>
  <input class="url" id="url" value="https://retouch-api.vercel.app/api/retouch">

  <input id="file" type="file" accept="image/*">

  <div class="controls">
    <label><input type="checkbox" name="effect" value="wrinkles"> Морщины</label>
    <label><input type="checkbox" name="effect" value="eye_bags"> Мешки под глазами</label>
    <label><input type="checkbox" name="effect" value="double_chin"> Второй подбородок</label>
    <label><input type="checkbox" name="effect" value="belly"> Живот</label>
    <label><input type="checkbox" name="effect" value="waist"> Талия</label>
  </div>

  <label>
    Интенсивность:
    <select id="intensity">
      <option value="1">Естественно</option>
      <option value="2">Заметно</option>
      <option value="3">Сильно</option>
    </select>
  </label>

  <button id="send">Обработать</button>

  <pre id="status">Выберите фото и эффект.</pre>

  <div class="imgs">
    <div class="card"><b>До</b><img id="before"></div>
    <div class="card"><b>После</b><img id="after"></div>
  </div>

<script>
  const fileEl = document.getElementById('file');
  const before = document.getElementById('before');
  const after = document.getElementById('after');
  const statusEl = document.getElementById('status');

  fileEl.onchange = () => {
    const file = fileEl.files[0];
    if(file) before.src = URL.createObjectURL(file);
  };

  document.getElementById('send').onclick = async () => {
    const url = document.getElementById('url').value.trim();
    const file = fileEl.files[0];
    const effects = [...document.querySelectorAll('[name=effect]:checked')].map(x=>x.value);

    if(!file || !effects.length){
      statusEl.textContent = 'Выберите фото и хотя бы один эффект.';
      return;
    }

    const form = new FormData();
    form.append('image', file);
    form.append('effects', JSON.stringify(effects));
    form.append('intensity', document.getElementById('intensity').value);

    statusEl.textContent = 'Отправили в GPT Image 2. Ждём результат...';
    after.removeAttribute('src');

    try{
      const started = Date.now();
      const res = await fetch(url,{method:'POST',body:form});

      if(!res.ok){
        const text = await res.text();
        statusEl.textContent = 'HTTP ' + res.status + '\n' + text;
        return;
      }

      const blob = await res.blob();
      after.src = URL.createObjectURL(blob);
      statusEl.textContent =
        'Готово за ' + ((Date.now()-started)/1000).toFixed(1) +
        ' сек.\nРазмер результата: ' + Math.round(blob.size/1024) + ' KB';
    }catch(e){
      statusEl.textContent = 'Ошибка: ' + e.message;
    }
  };
</script>
</body>
</html>
